services:
  postgres:
    image: postgres:16-alpine
    container_name: mcos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcos
      POSTGRES_PASSWORD: mcos
      POSTGRES_DB: mcos
    ports: ["5433:5432"]
    volumes: ["mcos-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcos -d mcos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mcos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["mcos-redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mcos-pgdata:
  mcos-redisdata:
