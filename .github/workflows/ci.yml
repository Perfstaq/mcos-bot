name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcos
          POSTGRES_PASSWORD: mcos
          POSTGRES_DB: mcos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcos -d mcos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mcos:mcos@localhost:5432/mcos?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      # The suite provisions its own mcos_test database and runs on Redis
      # database 15, so it cannot collide with anything else on these services.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E ring (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A separate runner from `verify`, so this job's own mcos_e2e database and
    # its own Redis logical database (14) never share a Postgres/Redis server
    # with the unit suite. e2e/env.ts points at these services via
    # E2E_PG_PORT/E2E_REDIS_PORT — see that file for the full port story,
    # including why local development needs neither variable set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcos
          POSTGRES_PASSWORD: mcos
          POSTGRES_DB: mcos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcos -d mcos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_PG_HOST: localhost
      E2E_PG_PORT: "5432"
      E2E_REDIS_HOST: localhost
      E2E_REDIS_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Playwright's own browser download, not part of `npm ci`. If this step
      # is ever blocked by network policy, that is the one thing to check
      # first — see docs/demo-runbook.md for how to confirm the rest of the
      # ring still works with the e2e job skipped.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the e2e ring
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
