version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      # One PR per ecosystem cluster rather than twelve — patch churn in the AWS
      # SDK or the Prisma pair is never independently reviewable anyway.
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "react-router-dom"]
      dev-tooling:
        patterns: ["typescript", "vitest", "tsx", "vite", "@vitejs/*"]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
